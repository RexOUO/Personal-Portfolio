<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rex Huang · Software Engineer</title>
    <meta name="description" content="Rex Huang — web developer looking for Intern / Graduate / Junior Software Engineer roles." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/jpeg" href="./avatar.jpg" />
    <link rel="apple-touch-icon" href="./avatar.jpg" />

    <!-- Link preview (LinkedIn, Discord, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rex Huang · Software Engineer" />
    <meta property="og:description" content="Web developer looking for Intern / Graduate / Junior Software Engineer roles." />
    <meta property="og:url" content="https://rexouo.github.io/Personal-Portfolio/" />
    <meta property="og:image" content="https://rexouo.github.io/Personal-Portfolio/avatar.jpg" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Apply the saved theme before the page paints, so there is no flash. Default: dark. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
